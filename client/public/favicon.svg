<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Dark luxury background -->
    <rect id="bg" width="120" height="120" rx="28" fill="#050B14" />
    
    <!-- Left V-Arm Cyan/Cobalt Gradient -->
    <linearGradient id="vCyanCobalt" x1="20" y1="15" x2="65" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1d4ed8" />
      <stop offset="25%" stopColor="#0284c7" />
      <stop offset="60%" stopColor="#00f2fe" />
      <stop offset="100%" stopColor="#06b6d4" />
    </linearGradient>

    <!-- Bevel Ridge Highlight -->
    <linearGradient id="vBevelHighlight" x1="25" y1="20" x2="60" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.8" />
      <stop offset="50%" stopColor="#a5f3fc" stopOpacity="0.3" />
      <stop offset="100%" stopColor="#00f2fe" stopOpacity="0" />
    </linearGradient>

    <!-- Right Leaf Emerald/Lime Gradient -->
    <linearGradient id="vLeafEmeraldLime" x1="55" y1="85" x2="105" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#047857" />
      <stop offset="35%" stopColor="#10b981" />
      <stop offset="70%" stopColor="#22c55e" />
      <stop offset="100%" stopColor="#84cc16" />
    </linearGradient>

    <!-- Center Leaf Vein Shadow -->
    <linearGradient id="vVeinShadow" x1="60" y1="75" x2="95" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#064e3b" stopOpacity="0.9" />
      <stop offset="100%" stopColor="#14532d" stopOpacity="0.4" />
    </linearGradient>

    <!-- Ambient Cyan/Emerald Glow -->
    <filter id="vGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" floodColor="#00f2fe" floodOpacity="0.5" />
      <feDropShadow dx="0" dy="0" stdDeviation="10" floodColor="#10b981" floodOpacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle with subtle border -->
  <rect width="120" height="120" rx="28" fill="#050B14" />
  <rect width="118" height="118" x="1" y="1" rx="27" stroke="rgba(0, 242, 254, 0.2)" stroke-width="1.5" />

  <!-- Centered Vynora 3D Emblem -->
  <g filter="url(#vGlow)">
    <!-- Left V-Arm: 3D Beveled Blade -->
    <path
      d="M24 22 C 28 17, 38 18, 44 26 L 59 66 C 62 74, 58 83, 50 85 C 44 86, 38 82, 35 75 L 22 34 C 20 28, 21 24, 24 22 Z"
      fill="url(#vCyanCobalt)"
    />
    <!-- Ridge Highlight on Left Arm -->
    <path
      d="M26 23 L 41 64 C 43 70, 42 75, 38 77"
      stroke="url(#vBevelHighlight)"
      stroke-width="2"
      stroke-linecap="round"
      opacity="0.85"
    />

    <!-- Right Arm: 3D Botanical Emerald-to-Lime Leaf -->
    <path
      d="M 50 81 C 50 81, 62 71, 69 55 C 77 38, 86 24, 104 17 C 105 26, 102 43, 91 58 C 81 70, 68 79, 54 83 C 51 84, 49 83, 50 81 Z"
      fill="url(#vLeafEmeraldLime)"
    />

    <!-- Sculpted Leaf Spine / Vein -->
    <path
      d="M 55 78 C 64 66, 75 51, 94 27"
      stroke="url(#vVeinShadow)"
      stroke-width="2.5"
      stroke-linecap="round"
    />
  </g>
</svg>