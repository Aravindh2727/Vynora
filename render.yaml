services:
  # -------------------------------------------------------------
  # Backend Express Server
  # -------------------------------------------------------------
  - type: web
    name: vynora-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: OPENROUTER_API_KEY
        sync: false

  # -------------------------------------------------------------
  # Frontend Vite React SPA (Static Site)
  # -------------------------------------------------------------
  - type: web
    name: vynora-client
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: vynora-server
          property: host
